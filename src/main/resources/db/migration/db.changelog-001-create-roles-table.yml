databaseChangeLog:
  - changeSet:
      id: 001-create-roles
      author: AlexS
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
        - addUniqueConstraint:
            tableName: roles
            columnNames: name
            constraintName: uq_roles_name